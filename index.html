<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Days Off Helper</title>
<style>
  :root{
    color-scheme:light;
    --page:#f5f3ef; --surface:#fffdfa; --ink:#22252b; --ink-soft:#3b4048; --muted:#585e68;
    --line:#e6e2db; --line-strong:#c4bfb6; --track:#eeebe5;
    --accent:#3867c0; --accent-hover:#2f58a6; --accent-soft:#e2eaf8; --on-accent:#fff; --accent-ink:#3867c0;
    --work-row:#e8eef9; --error:#c2392f;
    --shadow:0 1px 3px rgba(60,50,35,.06);
  }
  @media(prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --page:#131418; --surface:#1f2229; --ink:#eceef2; --ink-soft:#d6dae0; --muted:#adb3bd;
      --line:#343843; --line-strong:#585e6a; --track:#2a2d35;
      --accent:#3b6cd4; --accent-hover:#3161c4; --accent-soft:#283554; --on-accent:#fff; --accent-ink:#93b3f2;
      --work-row:#252f45; --error:#ff8a80;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3,p{margin:0}
  :focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
  .wrap{width:min(100% - 32px,920px);margin:0 auto;padding:36px 0 64px}

  h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
  .is-setup header{text-align:center}
  .summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:6px 0 20px;color:var(--ink-soft);font-size:16px}
  .link{background:none;border:0;padding:6px 0;color:var(--accent-ink);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--ink)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* ---------- Setup ---------- */
  .setup{display:grid;gap:22px;margin:20px auto 0;padding:22px 24px 24px;max-width:560px}
  .setup h2{font-size:19px;font-weight:650}
  fieldset{margin:0;padding:0;border:0;min-width:0}
  legend{display:block;margin:0 0 8px;padding:0;color:var(--ink-soft);font-size:16px;font-weight:600}
  .field-error{margin-top:8px;color:var(--error);font-size:15px;font-weight:600}
  .toggles{display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--track)}
  .toggles label{
    flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;margin:0;padding:0 6px;
    border-radius:8px;color:var(--ink-soft);font-size:16px;font-weight:500;cursor:pointer;user-select:none;
    transition:background-color .12s,color .12s
  }
  .toggles input{position:absolute;opacity:0;pointer-events:none}
  .toggles label:hover{color:var(--ink)}
  .toggles input:checked+label{background:var(--accent);color:var(--on-accent);font-weight:600}
  .toggles input:disabled+label{opacity:.45;cursor:not-allowed}
  .toggles input:focus-visible+label{outline:3px solid var(--accent-ink);outline-offset:1px}
  .setup-actions{display:flex;gap:10px}
  .button{
    min-height:48px;padding:0 22px;border:1px solid var(--line-strong);border-radius:10px;
    background:var(--surface);color:var(--ink);font-weight:600
  }
  .button:hover{background:var(--track)}
  .button.primary{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
  .button.primary:hover{background:var(--accent-hover)}

  /* ---------- Pay period ---------- */
  .period-nav{
    display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;
    padding:16px;border-bottom:1px solid var(--line);text-align:center
  }
  .eyebrow{color:var(--muted);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .period-title{font-size:21px;font-weight:650;letter-spacing:-.015em}
  .nav-button{
    display:grid;place-items:center;width:48px;height:48px;padding:0;
    border:1px solid var(--line-strong);border-radius:50%;background:transparent;color:var(--ink);
    transition:background-color .12s,border-color .12s,color .12s
  }
  .nav-button svg{width:20px;height:20px}
  .nav-button:hover{border-color:var(--accent-ink);background:var(--accent-soft);color:var(--accent-ink)}
  .nav-button:active{transform:scale(.95)}
  .back{display:block;margin:2px auto 0;padding:2px 0}

  .weeks{display:grid;grid-template-columns:1fr 1fr}
  .week{padding:18px 20px 20px;min-width:0}
  .week+.week{border-left:1px solid var(--line)}
  .week h3{margin-bottom:10px;font-size:17px;font-weight:650}
  .week h3 span{margin-left:10px;color:var(--muted);font-weight:500;font-size:15px}

  .day-table{width:100%;border-collapse:separate;border-spacing:0 3px}
  .day-table th{padding:0 12px 6px;color:var(--muted);font-size:14px;font-weight:600;text-align:left}
  .day-table td{height:50px;padding:0 12px;font-size:17px;font-weight:650;white-space:nowrap}
  .day-table td:first-child{border-radius:10px 0 0 10px}
  .day-table td:last-child{border-radius:0 10px 10px 0}
  .day-table .day{width:40%}
  .day-table .date{margin-left:8px;color:var(--ink-soft);font-weight:400}
  .is-work td{background:var(--work-row)}
  .is-off td{color:var(--muted);font-weight:400}
  .is-off .date{color:var(--muted)}
  .off-label{font-style:italic}
  .tag{
    display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;
    background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;vertical-align:2px
  }

  @media(max-width:640px){
    .wrap{padding:20px 0 44px}
    h1{font-size:22px}
    .setup{padding:18px 16px}
    .toggles label{padding:0 2px;font-size:15px}
    .period-nav{gap:4px;padding:12px 10px}
    .period-title{font-size:18px}
    .weeks{grid-template-columns:1fr}
    .week{padding:16px 12px}
    .week+.week{border-left:0;border-top:1px solid var(--line)}
    .day-table th,.day-table td{padding:0 10px}
    .day-table td{height:48px;font-size:16px}
  }
  @media(max-width:380px){
    .toggles{gap:2px}
    .toggles label{font-size:14px}
    .period-nav{grid-template-columns:42px 1fr 42px}
    .nav-button{width:42px;height:42px}
    .day-table th,.day-table td{padding:0 7px}
    .day-table .date{margin-left:5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Days off helper</h1>
    <p class="summary" id="summary" hidden>
      <span id="summaryText"></span>
      <button class="link" id="editSettings" type="button">Change</button>
    </p>
  </header>

  <main>
    <form class="panel setup" id="setup" hidden novalidate>
      <h2 id="setupHeading">Your schedule</h2>
      <fieldset>
        <legend>Shift</legend>
        <div class="toggles">
          <input type="radio" name="shift" id="shiftDays" value="Days" checked><label for="shiftDays">Days</label>
          <input type="radio" name="shift" id="shiftSwings" value="Swings"><label for="shiftSwings">Swings</label>
          <input type="radio" name="shift" id="shiftMids" value="Mids"><label for="shiftMids">Mids</label>
        </div>
      </fieldset>

      <fieldset id="dayChecks">
        <legend>Your days off this week</legend>
        <div class="toggles">
          <input type="checkbox" id="d1"><label for="d1">Mon</label>
          <input type="checkbox" id="d2"><label for="d2">Tue</label>
          <input type="checkbox" id="d3"><label for="d3">Wed</label>
          <input type="checkbox" id="d4"><label for="d4">Thu</label>
          <input type="checkbox" id="d5"><label for="d5">Fri</label>
          <input type="checkbox" id="d6"><label for="d6">Sat</label>
          <input type="checkbox" id="d0"><label for="d0">Sun</label>
        </div>
        <p class="field-error" id="daysError" role="alert" hidden>Pick at least one day off.</p>
      </fieldset>

      <div class="setup-actions">
        <button class="button primary" type="submit" id="saveSettings">Show my timesheet</button>
        <button class="button" type="button" id="cancelSettings" hidden>Cancel</button>
      </div>
    </form>

    <section class="panel" id="timesheet" aria-labelledby="periodTitle" hidden>
      <div class="period-nav">
        <button class="nav-button" id="previousPeriod" type="button" aria-label="Previous pay period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div aria-live="polite">
          <p class="eyebrow" id="periodLabel"></p>
          <h2 class="period-title" id="periodTitle"></h2>
          <button class="link back" id="backToCurrent" type="button" hidden>Back to this pay period</button>
        </div>
        <button class="nav-button" id="nextPeriod" type="button" aria-label="Next pay period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>

      <div class="weeks">
        <section class="week">
          <h3>Week 1<span id="week1Range"></span></h3>
          <table class="day-table">
            <thead><tr><th scope="col">Day</th><th scope="col">Shift</th><th scope="col">Hours</th></tr></thead>
            <tbody id="week1"></tbody>
          </table>
        </section>
        <section class="week">
          <h3>Week 2<span id="week2Range"></span></h3>
          <table class="day-table">
            <thead><tr><th scope="col">Day</th><th scope="col">Shift</th><th scope="col">Hours</th></tr></thead>
            <tbody id="week2"></tbody>
          </table>
        </section>
      </div>
    </section>
  </main>
</div>

<script>
/* The first day of any one pay period (a Monday). Every pay period is two weeks
   after the last, so if the dates look off by a week, move this by 7 days. */
const PAY_PERIOD_START = new Date(2026,10,2); // Mon Nov 2, 2026

const HOURS = "10 Hours";
const MAX_DAYS_OFF = 3;
const STORAGE_KEY = "timesheet-helper";
const OLD_STORAGE_KEY = "rotating-days-off-settings";
const shortNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const weekOrder = [1,2,3,4,5,6,0];
const oldShiftCodes = {D10:"Days",S10:"Swings",M10:"Mids"};

const $ = id=>document.getElementById(id);
const dayBoxes = Array.from({length:7},(_,i)=>$(`d${i}`));
const shiftRadios = Array.from(document.querySelectorAll('input[name="shift"]'));
let settings = null; // {shift, days:[weekday numbers], anchor:{y,m}}
let offset = 0;      // pay periods away from the current one

/* ---------- Dates ---------- */
function addDays(date,days){
  const result = new Date(date);
  result.setDate(result.getDate()+days);
  return result;
}
const sameDay = (a,b)=>a.toDateString()===b.toDateString();
const daysBetween = (a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const monthDay = date=>date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fullDate = date=>date.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const mondayOnOrBefore = date=>addDays(date,-((date.getDay()+6)%7));

function currentPeriodStart(){
  const periods = Math.floor(daysBetween(PAY_PERIOD_START,new Date())/14);
  return addDays(PAY_PERIOD_START,periods*14);
}

/* ---------- Rotation ----------
   A month's days off take effect on the Monday of the week containing the 1st,
   and every month shifts each day off forward by one weekday. */
function rotationMonth(date){
  const nextFirst = new Date(date.getFullYear(),date.getMonth()+1,1);
  if(date>=mondayOnOrBefore(nextFirst)) return {y:nextFirst.getFullYear(),m:nextFirst.getMonth()};
  const currentFirst = new Date(date.getFullYear(),date.getMonth(),1);
  if(date>=mondayOnOrBefore(currentFirst)) return {y:date.getFullYear(),m:date.getMonth()};
  const previous = new Date(date.getFullYear(),date.getMonth()-1,1);
  return {y:previous.getFullYear(),m:previous.getMonth()};
}
function daysOffOn(date){
  const month = rotationMonth(date);
  const shifts = (month.y-settings.anchor.y)*12+(month.m-settings.anchor.m);
  return settings.days.map(day=>((day+shifts)%7+7)%7);
}

/* ---------- Settings ---------- */
function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved && saved.shift && saved.days && saved.days.length && saved.anchor) return saved;
    // Carry over settings from the earlier version of this page.
    const old = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY));
    if(old && old.anchorMonth && Array.isArray(old.days) && old.days.length){
      const [y,m] = old.anchorMonth.split("-").map(Number);
      return {shift:oldShiftCodes[old.workCode]||"Days",days:old.days.slice(0,MAX_DAYS_OFF),anchor:{y,m:m-1}};
    }
  }catch(error){ /* unreadable or unavailable storage: start fresh */ }
  return null;
}
function saveSettings(){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(settings)); }catch(error){ /* won't persist */ }
}
function selectedDays(){
  return dayBoxes.flatMap((box,i)=>box.checked ? [i] : []);
}
function updateDayLimit(){
  const full = selectedDays().length>=MAX_DAYS_OFF;
  dayBoxes.forEach(box=>{ box.disabled = full && !box.checked; });
  if(selectedDays().length) $("daysError").hidden = true;
}
function listDays(days){
  const names = weekOrder.filter(d=>days.includes(d)).map(d=>shortNames[d]);
  return names.length>1 ? `${names.slice(0,-1).join(", ")} & ${names.at(-1)}` : names[0];
}

/* ---------- Screens ---------- */
function openSetup(){
  document.body.classList.add("is-setup");
  const today = new Date();
  const current = settings ? daysOffOn(today) : [];
  shiftRadios.forEach(radio=>{ radio.checked = radio.value===(settings ? settings.shift : "Days"); });
  dayBoxes.forEach((box,i)=>{ box.checked = current.includes(i); });
  updateDayLimit();
  $("daysError").hidden = true;
  $("setupHeading").textContent = settings ? "Change your schedule" : "First, your schedule";
  $("saveSettings").textContent = settings ? "Save" : "Show my timesheet";
  $("cancelSettings").hidden = !settings;
  $("setup").hidden = false;
  $("timesheet").hidden = true;
  $("summary").hidden = true;
}
function showTimesheet(){
  document.body.classList.remove("is-setup");
  $("setup").hidden = true;
  $("timesheet").hidden = false;
  $("summary").hidden = false;
  $("summaryText").textContent = `${settings.shift} shift · Off ${listDays(daysOffOn(new Date()))} this week`;
  renderPeriod();
}
function renderPeriod(){
  const start = addDays(currentPeriodStart(),offset*14);
  const end = addDays(start,13);
  const today = new Date();

  $("periodLabel").textContent =
    offset===0 ? "This pay period" :
    offset===1 ? "Next pay period" :
    offset===-1 ? "Last pay period" :
    offset>0 ? `${offset} pay periods ahead` : `${-offset} pay periods ago`;
  $("periodTitle").textContent = `${start.getFullYear()===end.getFullYear() ? monthDay(start) : fullDate(start)} – ${fullDate(end)}`;
  $("backToCurrent").hidden = offset===0;

  [0,1].forEach(w=>{
    const weekStart = addDays(start,w*7);
    $(`week${w+1}Range`).textContent = `${monthDay(weekStart)} – ${monthDay(addDays(weekStart,6))}`;
    const body = $(`week${w+1}`);
    body.innerHTML = "";
    for(let i=0;i<7;i++){
      const date = addDays(weekStart,i);
      const isOff = daysOffOn(date).includes(date.getDay());
      const isToday = sameDay(date,today);
      const row = document.createElement("tr");
      row.className = isOff ? "is-off" : "is-work";
      row.innerHTML = `
        <td class="day">${shortNames[date.getDay()]}<span class="date">${date.getMonth()+1}/${date.getDate()}</span>${isToday ? '<span class="tag">Today</span>' : ""}</td>
        ${isOff ? '<td colspan="2" class="off-label">Off, leave blank</td>' : `<td>${settings.shift}</td><td>${HOURS}</td>`}
      `;
      body.appendChild(row);
    }
  });
}

/* ---------- Events ---------- */
dayBoxes.forEach(box=>box.addEventListener("change",updateDayLimit));
$("setup").addEventListener("submit",event=>{
  event.preventDefault();
  const days = selectedDays();
  if(!days.length){ $("daysError").hidden = false; return; }
  settings = {
    shift:shiftRadios.find(radio=>radio.checked).value,
    days,
    anchor:rotationMonth(new Date())
  };
  saveSettings();
  offset = 0;
  showTimesheet();
});
$("cancelSettings").addEventListener("click",showTimesheet);
$("editSettings").addEventListener("click",openSetup);
$("previousPeriod").addEventListener("click",()=>{ offset--; renderPeriod(); });
$("nextPeriod").addEventListener("click",()=>{ offset++; renderPeriod(); });
$("backToCurrent").addEventListener("click",()=>{ offset = 0; renderPeriod(); });

settings = loadSettings();
if(settings) showTimesheet(); else openSetup();
</script>
</body>
</html>
